name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: python -m pytest tests/ -v

  pipeline-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # CI uses the development sample only; the research dataset is never
      # fetched here (it is ~48 MB and is not needed to check the code).
      - name: Write development sample
        run: python scripts/create_sample_data.py

      - name: Run pipeline (development sample)
        run: python -m privacy_preserving_nad.pipeline

      - name: Verify outputs and smoke-test labeling
        run: |
          test -f results/metrics/evaluation_results.json
          test -f results/metrics/comparison.csv
          test -f results/metrics/dataset_info.json
          test -f results/figures/model_comparison_f1.png
          python -c "import json; d = json.load(open('results/metrics/dataset_info.json')); assert d['kind'] == 'development-sample', d"

      - name: Report generator imports
        run: python -c "import privacy_preserving_nad.pipeline, privacy_preserving_nad.data.dataset; print('imports ok')"
