seed: 42
tag: full
dataset:
  name: unsw_nb15
  raw_dir: data/raw
  load_options: {}
features:
  use_cross_dataset_only: false
temporal:
  train_fraction: 0.5
  validation_fraction: 0.15
  backtest_fraction: 0.15
  forward_fraction: 0.2
  use_forward: true
metrics:
  target_fpr: 0.05
models:
  enabled:
  - majority
  - logistic_regression
  - random_forest
  - gradient_boosting
  logistic_regression:
    max_iter: 1000
    C: 1.0
    solver: lbfgs
    class_weight: balanced
  random_forest:
    n_estimators: 200
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 2
    class_weight: balanced
    n_jobs: -1
  gradient_boosting:
    n_estimators: 100
    max_depth: 3
    learning_rate: 0.1
    subsample: 1.0
drift:
  enabled: true
  reference_period: train
  window: 1h
  stride: 1h
  min_samples: 200
  methods:
  - ks
  - wasserstein
  - psi
  - cusum
  alpha: 0.01
  wasserstein_threshold: 0.1
  psi_threshold: 0.2
  psi_bins: 10
adaptation:
  window: 6h
  strategies:
  - none
  - threshold_recalibration
  - recent_window_retrain
  - rolling_window_retrain
  - historical_plus_recent_retrain
  rolling_step: 1h
  rolling_window: 6h
output:
  experiments_dir: results/experiments
