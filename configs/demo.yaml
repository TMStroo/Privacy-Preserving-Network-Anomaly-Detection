# DriftGuard demo configuration.
#
# Runs entirely on a deterministic synthetic fixture generated by
# `python -m driftguard demo`. This is pipeline verification, NOT a research
# benchmark: the data is generated, its drift is inserted on purpose, and none
# of the numbers it produces say anything about real networks.

seed: 7
tag: demo

dataset:
  name: synthetic
  raw_dir: data/raw
  rows: 60000
  days: 20
  shift_at_fraction: 0.6
  shift_kind: packet_size
  shift_magnitude: 3.0

features:
  use_cross_dataset_only: false

temporal:
  train_fraction: 0.40
  validation_fraction: 0.15
  backtest_fraction: 0.15
  forward_fraction: 0.30
  use_forward: true

metrics:
  target_fpr: 0.05

models:
  enabled: [majority, logistic_regression, random_forest]
  logistic_regression:
    max_iter: 500
    C: 1.0
    solver: lbfgs
    class_weight: balanced
  random_forest:
    n_estimators: 60
    max_depth: 12
    class_weight: balanced
    n_jobs: -1

drift:
  enabled: true
  reference_period: train
  window: 4h
  stride: 4h
  min_samples: 150
  methods: [ks, wasserstein, psi]
  alpha: 0.01
  wasserstein_threshold: 0.10
  psi_threshold: 0.20

adaptation:
  window: 12h
  strategies: [none, threshold_recalibration, recent_window_retrain]

output:
  experiments_dir: results/demo
