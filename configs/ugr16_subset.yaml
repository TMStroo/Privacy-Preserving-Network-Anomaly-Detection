# DriftGuard benchmark on the UGR'16 SUBSET.
#
# The full UGR'16 release is roughly 215 GB across 23 weekly archives. This
# config uses a documented subset - see SUBSET_NOTES in
# src/driftguard/data/registry.py and the UGR'16 section of the report.
# Results from this run are subset results and are never described as
# full-dataset UGR'16 numbers.
#
# UGR'16 is the dataset designed for long-term traffic evolution: the netflow
# export covers one-second buckets, and the test weeks contain both background
# and attack traffic. That makes it a much better temporal axis than
# UNSW-NB15's three capture days, which is why it carries the temporal claim
# while UNSW-NB15 keeps the cross-dataset comparison honest.

experiment:
  kind: temporal
  output_dir: results/experiments

dataset:
  name: ugr16
  adapter: ugr16
  raw_dir: data/raw
  load_options:
    # One in twenty rows per archive. The weekly archives hold hundreds of
    # millions of flows each and the statistics this project measures are
    # stable under uniform thinning; the rate is recorded in the experiment
    # metadata so a reader can reproduce the exact sample.
    max_rows_per_file: 4000000

temporal:
  train_fraction: 0.5
  validation_fraction: 0.15
  backtest_fraction: 0.15
  forward_fraction: 0.2
  use_forward: true

models:
  - majority
  - logistic_regression
  - random_forest
  - gradient_boosting

metrics:
  target_fpr: 0.05

drift:
  enabled: true
  reference_period: train
  # UGR'16 resolves flows to one-second buckets across a month of traffic, so a
  # twelve-hour window clears the minimum sample count comfortably while still
  # resolving week-to-week movement. Overridden in the ablations to show what a
  # different window does to the alert count.
  window: 12h
  stride: 12h
  min_samples: 500
  methods: [ks, wasserstein, psi, cusum]
  alpha: 0.01
  psi_threshold: 0.2
  wasserstein_threshold: 0.1
  cusum_drift: 0.5
  cusum_false_alarm_rate: 0.01
  # UGR'16 netflow has no direction split, so drift is measured on the fields
  # the export actually provides.
  features:
    - flow_duration
    - total_packets
    - total_bytes
    - packet_rate
    - byte_rate
    - mean_packet_size
    - bytes_per_packet
    - duration_log1p

adaptation:
  strategies:
    - none
    - threshold_recalibration
    - recent_window_retrain
    - rolling_window_retrain
    - historical_plus_recent_retrain
  window: 24h
  target_fpr: 0.05

seed: 42
